<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spore.host</title>
  <meta name="robots" content="noindex">
  <!-- The rebuilt portal (spore-host#645, Phase 0 #683). NOT DEPLOYED: deploy-site
       publishes web/dist/, which this app is never built into. The marker lets
       scripts/portal-not-deployed.test.mjs and the deploy workflows prove that. -->
  <meta name="spore-host-page" content="portal">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;700&display=swap">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <script type="module" src="./src/main.ts"></script>
</head>
<body>
  <a href="#main" class="skip-link" data-control="chrome.skip-link">Skip to content</a>
  <div id="topbar-slot"></div>
  <main id="main" tabindex="-1">
    <div id="banner" class="banner-slot"></div>
    <div id="page"></div>
  </main>
  <footer class="site-footer">
    <ul class="site-footer-links">
      <li><a href="/" data-control="chrome.footer-link">spore.host home</a></li>
      <li><a href="https://docs.spore.host/" data-control="chrome.footer-link">Documentation</a></li>
      <li><a href="/privacy.html" data-control="chrome.footer-link">Privacy</a></li>
      <li><a href="/terms.html" data-control="chrome.footer-link">Terms</a></li>
    </ul>
  </footer>
  <!-- The shell's two live regions (SC 4.1.3), present from first paint. -->
  <div id="announce-polite" class="visually-hidden" role="status" aria-live="polite"></div>
  <div id="announce-assertive" class="visually-hidden" role="alert"></div>
</body>
</html>
