AWSTemplateFormatVersion: '2010-09-09'
Description: >
  spore.host portal — BYOA onboarding. Creates a cross-account IAM role that lets
  the spore.host portal launch and manage EC2 instances in THIS account on your
  behalf, and (via a phone-home custom resource) auto-registers the role with the
  portal so there is nothing to copy-paste.

  Deploy this once per AWS account you want to use with the portal. The web
  quick-create builds the console URL for you; the `spawn onboard` CLI does the
  equivalent without the console.

Parameters:
  PhoneHomeLambdaRoleArn:
    Type: String
    Description: >
      ARN of the portal phone-home Lambda execution role in spore-host-infra
      (the PortalPhoneHomeLambdaRole output of infra/tofu/portal-phone-home).
      Allowed to assume the role created here, alongside ProberLambdaRoleArn.
    AllowedPattern: 'arn:aws:iam::\d{12}:role/.+'
    ConstraintDescription: Must be a valid IAM role ARN

  ProberLambdaRoleArn:
    Type: String
    Default: ''
    Description: >
      ARN of the portal account-prober Lambda execution role in spore-host-infra
      (the role_arn output of infra/tofu/portal-account-prober). It periodically
      assumes this role and calls ec2:DescribeInstances — nothing else — to check
      whether the account is still reachable and whether it still runs any spores.
      That is the signal spore.host uses to expire DNS records belonging to accounts
      that have been deprovisioned, so a stale record cannot later resolve to a
      stranger's instance.

      Leave blank to omit it. Blank is SAFE rather than merely tolerated: an account
      whose trust policy does not name the prober simply denies it, and the lifecycle
      state machine treats a denial from an account it has never successfully probed
      as no evidence at all — not as an uninstall. The only cost of omitting it is
      that this account's DNS records are never eligible for automatic expiry.
    AllowedPattern: '^$|arn:aws:iam::\d{12}:role/.+'
    ConstraintDescription: Must be a valid IAM role ARN, or empty

  PhoneHomeUrl:
    Type: String
    Default: 'https://omnvm7osdhhnr2f7qm4xghz2xq0txwjl.lambda-url.us-east-1.on.aws/'
    Description: >
      The portal phone-home Function URL (function_url output of
      infra/tofu/portal-phone-home). The custom resource POSTs the new role's
      registration here on stack create. Defaults to the deployed prod endpoint.
    AllowedPattern: 'https://.+'

  ExternalId:
    Type: String
    Description: >
      High-entropy STS ExternalId the portal must present when assuming this role
      (confused-deputy guard). The web quick-create + `spawn onboard` generate one
      per account; do not reuse across accounts.
    MinLength: 16
    NoEcho: true

  RoleName:
    Type: String
    Default: spore-portal-onboard
    Description: Name of the cross-account role to create.

  SporedInstanceRole:
    Type: String
    Default: spored-instance-role
    Description: >
      The IAM role inside the instance profile launched instances receive
      (spored-instance-profile holds spored-instance-role). iam:PassRole is
      evaluated against the role's ARN, so this names the role, not the
      profile. Must exist in this account (spawn creates it on first launch).

# The account boundary (spawn#1582): this template creates a role another
# account can assume.
Rules:
  NotTheForbiddenAccount:
    Assertions:
      - Assert: !Not [!Equals [!Ref 'AWS::AccountId', '942542972736']]
        AssertDescription: >-
          This template creates a role another account can assume, and must
          never be deployed in 942542972736: an Amazon-internal account and the
          management account of its AWS Organization, which no spore.host
          account may be trusted into or out of (spawn#1582). Deploy it in a
          member account. A management account of any other organization is
          refused by spawn's CLI paths, which can ask AWS Organizations; this
          rule cannot, so do not deploy it in one either.

Conditions:
  # The prober principal is optional so this template stays deployable by anyone who
  # only has the phone-home ARN to hand, and so an existing stack can be updated to
  # add the prober later without a template change.
  HasProberRole: !Not [!Equals [!Ref ProberLambdaRoleArn, '']]

Resources:

  PortalOnboardRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Allows the spore.host portal to launch + manage EC2 in this account.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref PhoneHomeLambdaRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
          # The lifecycle prober (optional — see the ProberLambdaRoleArn parameter).
          # Same ExternalId guard. Note it inherits the SAME permissions as the
          # statement above, because a trust policy says who may assume, not what
          # they may then do — so on paper the prober could RunInstances here.
          # It cannot in practice: the prober attaches an STS SESSION POLICY allowing
          # only ec2:DescribeInstances, and effective permissions are the intersection
          # of the two, so the credentials it holds cannot launch or terminate
          # anything even if the prober itself is compromised. That self-limit is in
          # lambda/portal-account-prober/main.go, and it is why this does not need a
          # second, read-only role in your account.
          - !If
            - HasProberRole
            - Effect: Allow
              Principal:
                AWS: !Ref ProberLambdaRoleArn
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  sts:ExternalId: !Ref ExternalId
            - !Ref 'AWS::NoValue'
      Policies:
        - PolicyName: PortalEC2Launch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RunAndInspect
                Effect: Allow
                Action:
                  - ec2:RunInstances
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeImages
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                  - ec2:DescribeKeyPairs
                Resource: '*'
              # Tags only as part of the RunInstances request that creates the
              # resource. ec2:CreateAction is absent from a CreateTags call on an
              # existing resource, so this grants no retagging: the portal tags
              # at launch and nowhere else. Unconditioned, CreateTags could put
              # spawn:managed=true on any instance in this account and so widen
              # every grant scoped by that tag, here and in spawn's other roles.
              - Sid: TagOnLaunch
                Effect: Allow
                Action:
                  - ec2:CreateTags
                Resource: '*'
                Condition:
                  StringEquals:
                    'ec2:CreateAction': RunInstances
              # Belt and braces for the statement above: the keys that say which
              # resources spawn owns are never written or removed on an existing
              # resource with this role, whatever else is attached to it.
              - Sid: DenyOwnershipTagsAfterCreate
                Effect: Deny
                Action:
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: '*'
                Condition:
                  'Null':
                    'ec2:CreateAction': 'true'
                  'ForAnyValue:StringEquals':
                    'aws:TagKeys':
                      - 'spawn:managed'
                      - 'spawn:root'
                      - 'spawn:created-by'
                      - 'spawn:iam-user'
                      - 'spawn:account-id'
                      - 'spawn:launch-time'
                      - 'spawn:config'
                      - 'spawn:nested-parent'
                      - 'spawn:pre-stop'
                      - 'spawn:pre-stop-timeout'
                      - 'spawn:local-username'
                      - 'spawn:instance-id'
                      - 'spawn:instance-arn'
              # No Stop, Start or Terminate, matching the live portal role
              # (infra/tofu/portal-oidc/main.tf, spore-host#678 and #694). They
              # come back under the scoped policy of #686, not as a tag-gated
              # statement here.
              - Sid: ReadSpotAndQuotas
                Effect: Allow
                Action:
                  - ec2:DescribeSpotPriceHistory
                  - servicequotas:GetServiceQuota
                  - servicequotas:ListServiceQuotas
                Resource: '*'
              # Scoped to spawn-managed instances, as on the live portal role. The
              # tag is a real scope only because TagOnLaunch and
              # DenyOwnershipTagsAfterCreate keep this role from adding it to an
              # instance that already exists.
              #
              # ssm:resourceTag/, not aws:ResourceTag/: SSM evaluates the target
              # node's tags under its own service-specific condition key here.
              - Sid: SSMSessionOnManagedInstances
                Effect: Allow
                Action:
                  - ssm:StartSession
                Resource: 'arn:aws:ec2:*:*:instance/*'
                Condition:
                  StringEquals:
                    'ssm:resourceTag/spawn:managed': 'true'
              # The session document, deliberately NOT tag-conditioned and so a
              # separate statement: a document carries no spawn:managed tag, so
              # folding it into the statement above would deny every session. This
              # grants the use of a shell document; the statement above decides which
              # targets it may be pointed at.
              - Sid: SSMSessionDocument
                Effect: Allow
                Action:
                  - ssm:StartSession
                Resource: 'arn:aws:ssm:*::document/SSM-SessionManagerRunShell'
              - Sid: SSMSessionManage
                Effect: Allow
                Action:
                  - ssm:TerminateSession
                  - ssm:ResumeSession
                Resource: 'arn:aws:ssm:*:*:session/*'
        - PolicyName: PortalPassSporedProfile
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # PassRole scoped to the single spored ROLE + PassedToService ec2
              # — required to attach its profile at RunInstances, nothing broader.
              # Names the role, not the profile: PassRole on role/<profile-name>
              # passes a role that does not exist (#672, spawn#817).
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${SporedInstanceRole}'
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
      Tags:
        - Key: 'spawn:managed'
          Value: 'false'
        - Key: Purpose
          Value: spore-portal-onboard

  # Phone-home custom resource: on stack CREATE, POST the new role's registration
  # to the portal so onboarding needs no copy-paste (the Coiled pattern). Backed
  # by an inline Lambda that signs a SigV4 request to the phone-home Function URL
  # using the stack's own execution credentials — so the phone-home handler sees
  # THIS account as the verified caller.
  PhoneHomeFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt PhoneHomeFunctionRole.Arn
      Environment:
        Variables:
          PHONE_HOME_URL: !Ref PhoneHomeUrl
      Code:
        ZipFile: |
          import json, os, urllib.request
          import boto3
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest
          import cfnresponse

          def handler(event, context):
              try:
                  if event["RequestType"] == "Delete":
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return
                  props = event["ResourceProperties"]
                  url = os.environ["PHONE_HOME_URL"]
                  body = json.dumps({
                      "roleArn": props["RoleArn"],
                      "externalId": props["ExternalId"],
                      "region": props.get("Region", "us-east-1"),
                  }).encode()
                  # Sign with the function's own (this-account) credentials so the
                  # phone-home handler's SigV4-verified caller == this account.
                  sess = boto3.Session()
                  creds = sess.get_credentials().get_frozen_credentials()
                  region = context.invoked_function_arn.split(":")[3]
                  req = AWSRequest(method="POST", url=url, data=body,
                                   headers={"content-type": "application/json"})
                  SigV4Auth(creds, "lambda", region).add_auth(req)
                  r = urllib.request.Request(url, data=body, method="POST",
                                             headers=dict(req.headers))
                  with urllib.request.urlopen(r, timeout=20) as resp:
                      out = resp.read().decode()
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {"response": out})
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"error": str(e)})

  PhoneHomeFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokePhoneHome
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # This role's identity grants itself invoke on the phone-home
              # Function URL — the per-account grant the AWS_IAM URL relies on.
              - Effect: Allow
                Action: lambda:InvokeFunctionUrl
                Resource: '*'

  PhoneHome:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt PhoneHomeFunction.Arn
      RoleArn: !GetAtt PortalOnboardRole.Arn
      ExternalId: !Ref ExternalId
      Region: !Ref AWS::Region

Outputs:
  RoleArn:
    Description: The cross-account role ARN (auto-registered with the portal).
    Value: !GetAtt PortalOnboardRole.Arn
  # NOTE: the ExternalId is deliberately NOT output. It's a NoEcho secret, and the
  # phone-home custom resource already registers {roleArn, externalId, region} with
  # the portal automatically — so there's no need to echo the secret back into the
  # stack outputs (which would defeat NoEcho; cfn-lint W2010). The onboarding
  # tool that launched the stack retains the value it generated.
