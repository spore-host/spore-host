# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Go modules: the five Lambda modules, the only go.mod files in this repo.
  # The old "/spawn" and "/truffle" entries named directories that left with
  # the CLIs' own repos, so the operated Lambdas (rest-api, accountlifecycle,
  # spore-bot, the portal phone-home and prober) got no update PRs at all
  # (#706). scripts/check_dependabot_coverage.py fails CI if a manifest
  # directory has no entry here, or an entry names a directory without one.
  - package-ecosystem: "gomod"
    directories:
      - "/lambda/accountlifecycle"
      - "/lambda/portal-account-prober"
      - "/lambda/portal-phone-home"
      - "/lambda/rest-api"
      - "/lambda/spore-bot"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "component:infrastructure"
      - "type:security"
    commit-message:
      prefix: "deps(lambda)"
      include: "scope"
    reviewers:
      - "scttfrdmn"
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
          - "github.com/aws/aws-lambda-go"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # npm: the website (web/, which also holds the portal rebuild) and the docs
  # site (docs/). Both deploy on merge, so their toolchains (vite, vitest,
  # happy-dom, playwright, vitepress, the spawn/truffle/lagotto-ts SDKs) are
  # production supply chain (#699, #706).
  - package-ecosystem: "npm"
    directories:
      - "/web"
      - "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "component:web-dashboard"
      - "type:security"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    reviewers:
      - "scttfrdmn"
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      spore-host-sdks:
        patterns:
          - "@spore-host/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Docker — point at the directories that actually contain Dockerfiles. The
  # previous single "/spawn" entry had no Dockerfile there and errored every run
  # ("No Dockerfiles nor Kubernetes YAML found in /spawn"); "/infra/amis" was the
  # same mistake and is gone too. Discover with:
  #   git ls-files | grep -E '(^|/)Dockerfile$'
  #
  # Ubuntu bases track LTS releases only. Dependabot proposes the newest tag, so
  # unpinned it offered the non-LTS 25.10 (#550, #551), which goes end-of-life
  # after nine months. Interim releases are ignored; the next LTS still arrives
  # as a normal PR. When a base moves to a new LTS, move the range with it.
  - package-ecosystem: "docker"
    directory: "/infra/amis/containers/paraview"
    ignore:
      # 26.10, 27.04, 27.10: everything between 26.04 LTS and 28.04 LTS.
      - dependency-name: "ubuntu"
        versions: ["> 26.04, < 28.04"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "type:security"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    reviewers:
      - "scttfrdmn"

  # ChimeraX installs UCSF's distro-specific .deb (ucsf-chimerax_<v>ubuntu<base>),
  # so its base can only be an Ubuntu that UCSF ships a production package for.
  # ChimeraX 1.12 has 22.04 and 24.04 packages; 26.04 exists only in daily builds.
  # Lift this when a production release lists an ubuntu26.04 .deb (see
  # https://www.cgl.ucsf.edu/chimerax/data/release-info/production.json).
  - package-ecosystem: "docker"
    directory: "/infra/amis/containers/chimerax"
    ignore:
      - dependency-name: "ubuntu"
        versions: ["> 24.04"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "type:security"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    reviewers:
      - "scttfrdmn"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "type:infra"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    reviewers:
      - "scttfrdmn"
    groups:
      github-actions:
        patterns:
          - "actions/*"
