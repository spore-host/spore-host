name: Sync CLI reference docs

# Pulls the generated command/flag reference (docs-gen/) from each CLI at its
# latest release tag into docs/gen/<cli>/ and opens a PR. Merging the PR triggers
# the continuous docs deploy (docs.yaml). The reference is generated + drift-gated
# in each CLI repo, so this workflow only vendors it — it never edits the tables.
#
# Triggered three ways:
#   - repository_dispatch (type: cli-docs-updated) fired by a CLI's release.yaml
#     after it cuts a tag, so a release flows to the docs automatically;
#   - workflow_dispatch, to resync on demand (optionally one CLI via `cli`);
#   - weekly schedule, as a backstop in case a dispatch is missed.

on:
  repository_dispatch:
    types: [cli-docs-updated]
  workflow_dispatch:
    inputs:
      cli:
        description: 'Which CLI to sync (spawn, truffle, lagotto, or "all")'
        required: false
        default: 'all'
  schedule:
    - cron: '17 8 * * 1' # Mondays 08:17 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Don't leave the checkout token as a git auth extraheader:
          # create-pull-request adds its own Authorization header, and git then
          # rejects the request with `Duplicate header: "Authorization"` (HTTP 400).
          persist-credentials: false

      - name: Determine which CLIs to sync
        id: which
        env:
          # repository_dispatch payload carries the source CLI; manual run uses
          # the input; schedule syncs all.
          DISPATCH_CLI: ${{ github.event.client_payload.cli }}
          INPUT_CLI: ${{ github.event.inputs.cli }}
        # A release dispatch (or a manual single-CLI run) still syncs EVERY CLI.
        # All runs share one PR branch (sync/cli-docs), which create-pull-request
        # rebuilds from main each time; syncing only the dispatching CLI wiped
        # any other CLI's not-yet-merged update off that branch. On 2026-11-06
        # spawn v0.161.0's sync was overwritten by lagotto v0.67.0's four hours
        # later, leaving spawn at v0.152.0 and truffle at v0.62.1 in the docs.
        # Each CLI is vendored from its latest release tag, so a full sync is
        # idempotent and cheap. The input is kept to restrict a manual run.
        #
        # The input is checked against an allow-list before it goes anywhere
        # (#708). It used to be echoed unchecked into the step output, which the
        # next step expanded with ${{ }} straight into its script, so
        # cli="spawn; <command>" ran <command> with this job's write token.
        run: |
          set -euo pipefail
          sel="${INPUT_CLI:-all}"
          if ! [[ "$sel" =~ ^(all|(spawn|truffle|lagotto)( (spawn|truffle|lagotto))*)$ ]]; then
            echo "::error::cli must be all, or a space-separated list of spawn, truffle and lagotto"
            exit 1
          fi
          # Printed as data through env, never interpolated into a script.
          printf 'dispatched by: %s; syncing: %s\n' "${DISPATCH_CLI:-<none>}" "$sel"
          if [ "$sel" = "all" ]; then
            echo "clis=spawn truffle lagotto" >> "$GITHUB_OUTPUT"
          else
            echo "clis=$sel" >> "$GITHUB_OUTPUT"
          fi

      - name: Vendor docs-gen from each CLI's latest tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through env, not ${{ }} in the script body (#708).
          CLIS: ${{ steps.which.outputs.clis }}
        run: |
          set -euo pipefail
          read -r -a clis <<<"$CLIS"
          for cli in "${clis[@]}"; do
            case "$cli" in spawn|truffle|lagotto) ;; *) echo "::error::unexpected cli '$cli'"; exit 1 ;; esac
            repo="spore-host/$cli"
            tag=$(gh release view --repo "$repo" --json tagName -q .tagName)
            echo "Syncing $repo @ $tag"
            tmp=$(mktemp -d)
            # docs-gen/ is committed in each CLI repo; fetch it at the release tag.
            gh api "repos/$repo/contents/docs-gen?ref=$tag" \
              --jq '.[] | select(.name | endswith(".md")) | .name + " " + .download_url' \
              > "$tmp/manifest"
            dest="docs/gen/$cli"
            rm -rf "$dest"; mkdir -p "$dest"
            while read -r name url; do
              curl -fsSL "$url" -o "$dest/$name"
            done < "$tmp/manifest"
            echo "$tag" > "$dest/.source-tag"
          done

      - name: Open sync PR
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          # Use the DOCS_SYNC_TOKEN PAT, not GITHUB_TOKEN: the org forbids Actions
          # from creating pull requests ("GitHub Actions is not permitted to create
          # or approve pull requests"), and a PAT acts as a user, bypassing that
          # restriction without loosening the org-wide policy.
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          branch: sync/cli-docs
          title: 'docs: sync generated CLI reference'
          commit-message: 'docs: sync generated CLI reference from latest tags'
          body: |
            Automated vendoring of each CLI's generated command/flag reference
            (`docs-gen/`) into `docs/gen/<cli>/`. Source tags are recorded in each
            `docs/gen/<cli>/.source-tag`.

            The reference is generated + drift-gated in the CLI repos; this PR only
            updates the vendored copy. Merging deploys via `docs.yaml`.
          delete-branch: true
