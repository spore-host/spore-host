name: Web CI

# PR gate for the portal (web/). Before this workflow web/ had NO pre-merge gate:
# ci.yml covers the Lambda modules and the docs build, and deploy-site.yaml runs
# typecheck + build only AFTER merge, on its way to publishing to S3. So a broken
# portal merged green and the failure surfaced during the deploy — or not at all,
# since deploy-site.yaml never ran `npm test` either (fixed there too).
#
# Its own file rather than a job in ci.yml because GitHub Actions has no per-job
# `paths:` filter, and ci.yml must keep running on Go/docs PRs. Same split as
# deploy-site.yaml.
#
# Lives here rather than being folded into #505 so the disclosure work wasn't held
# up behind a new workflow (spore-host#506).

# docs/gen/** and infra/tofu/portal-oidc/** are inputs to the portal gates: the
# CLI⇄GUI matrix is checked against the generated CLI reference, and the IAM
# fixture against the tofu policy. A sync-cli-docs PR that renames a flag, or
# a policy change, must run the gates that depend on it.
on:
  pull_request:
    paths:
      - 'web/**'
      - 'docs/gen/**'
      - 'infra/tofu/portal-oidc/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/gen/**'
      - 'infra/tofu/portal-oidc/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-tests:
    name: Portal typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Node 22 to match deploy-site.yaml — the gate and the deploy must build on
      # the same runtime, or a version-specific failure escapes the gate.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      # The suite that motivated this workflow. Several of these tests guard
      # defects that are invisible on inspection and expensive in production:
      # guided/shapes.test.ts runs against the REAL bundled truffle-ts catalog
      # (deliberately, not a fixture — a fixture would have passed while the
      # shipped portal quoted a fabricated $0.20/hr for a 72xB200), and
      # guided/launch.test.ts asserts every guided launch carries a TTL and
      # spot: false. A regression in the latter bills someone real money and no
      # amount of clicking reveals it before the invoice.
      #
      # This is also the job that catches a truffle-ts version bump breaking the
      # portal — the change most likely to break these tests, and exactly the kind
      # that gets merged on a green tick.
      - name: Test
        working-directory: web
        run: npm test

      # A passing suite over a bundle that doesn't build still ships nothing. The
      # build is cheap here and it's what deploy-site.yaml will run on main.
      - name: Build
        working-directory: web
        run: npm run build

      # Same guard deploy-site.yaml runs before uploading, caught pre-merge:
      # spore.host/app is the static placeholder while the portal is rebuilt
      # (spore-host#645), so the build must carry its marker, load no script,
      # and contain no old portal bundle (assets/app-*.js).
      - name: Assert /app is the placeholder and no portal bundle ships
        run: |
          set -euo pipefail
          page=web/dist/app/index.html
          grep -qF '<meta name="spore-host-page" content="app-placeholder">' "$page" \
            || { echo "::error::$page is not the /app placeholder (marker missing)." >&2; exit 1; }
          if grep -qi '<script' "$page"; then
            echo "::error::$page loads a script; the placeholder must not." >&2
            exit 1
          fi
          bundles="$(find web/dist/assets -name 'app-*.js' -print)"
          if [ -n "$bundles" ]; then
            echo "::error::old portal bundle(s) in the build: $bundles" >&2
            exit 1
          fi
          # The rebuilt portal (web/portal/, #683) is not published until slice 1
          # (#684) passes its gates. It builds into web/.portal-build/, never dist/;
          # its pages carry content="portal…" markers, so any that leak are found.
          leaked="$(grep -rlF 'name="spore-host-page" content="portal' web/dist || true)"
          if [ -n "$leaked" ] || [ -e web/dist/portal ]; then
            echo "::error::the rebuilt portal is in the build and would be deployed: ${leaked:-web/dist/portal}" >&2
            exit 1
          fi
          echo "✅ /app is the placeholder; no old or rebuilt portal in dist/"

  # The rebuilt portal (web/portal/, Phase 0 #683). NOT DEPLOYED: it builds into
  # web/.portal-build/ and deploy-site publishes web/dist/ only (see the
  # placeholder step above). A slice ships only when these pass (#645):
  #   - offline gates (npm run portal:test): token contrast, tokens-only CSS,
  #     banned-words lint on module copy, CLI⇄GUI matrix vs docs/gen, the IAM
  #     inventory from the production bundle, the IAM fixtures vs the policy and
  #     the tofu source, and the unit tests of the ported modules;
  #   - rendered gates (npm run portal:e2e, Playwright on a local `vite
  #     preview`): axe on every route and gallery state, keyboard and focus,
  #     44 px targets, 320 px reflow with and without text spacing, banned words
  #     in rendered copy, the rendered CLI⇄GUI matrix, and a self-test page that
  #     proves each rendered check can fail.
  # No AWS credentials exist in this job and the specs abort any AWS request.
  # The live IAM simulate and drift check are portal-iam-live.yml.
  portal-gates:
    name: Portal gates (unbuilt, not deployed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # The browser build matching the pinned @playwright/test version.
      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: web
        run: npm run portal:typecheck

      - name: Unit tests and offline gates
        working-directory: web
        run: npm run portal:test

      - name: Rendered gates (axe, keyboard, reflow, copy, matrix, self-test)
        working-directory: web
        run: npm run portal:e2e
