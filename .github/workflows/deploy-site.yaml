name: Deploy Site

# Deploys the marketing site AND spore.host/app on every push to main under
# web/**. spore.host/app is currently a static placeholder while the portal is
# rebuilt from scratch (spore-host#645); the old portal source sits unbuilt in
# web/legacy-app/. Before this workflow the site had NO CI
# deploy — it shipped only via the manual web/deploy.sh, so homepage edits sat in
# main until someone ran the script by hand and the live site drifted from source
# (exactly the staleness external reviews kept hitting). This gives web/ the same
# continuous, verified deploy the docs already have.
#
# `npm run build` emits web/dist/ (marketing pages + the app/ placeholder copied
# verbatim by scripts/copy-static.mjs; no bundler runs). We MUST still build and
# sync dist/, never the source tree: dist/ holds only publishable files and has
# the feature-flagged blocks removed, while raw web/ also carries legacy-app/,
# node_modules/ and the unflagged pages.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-site.yaml'
  workflow_dispatch:

# Nothing here holds id-token by default. Only the deploy job, which runs no
# npm code at all, may mint the OIDC token that assumes the deploy role
# (#699). The build job runs npm ci, the tests and the build, which is every
# third-party package in web/package-lock.json, with a read-only token and no
# way to reach AWS. It hands the deploy job web/dist/ as an artifact.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --ignore-scripts: no dependency's install hook runs. Nothing the site
      # build or tests use needs one (esbuild ships its binary as a per-platform
      # optional dependency; Playwright's browser download isn't used here).
      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      # Typecheck before deploying. A type error here means the bundle is wrong;
      # better to fail than ship it. web-ci.yml now gates this pre-merge too, so
      # this is the second line of defence rather than the only one.
      # The old portal (legacy-app/) is not deployed, but it still typechecks and
      # its tests still run, so it stays a sound reference for the rebuild (#645).
      - name: Typecheck portal
        working-directory: web
        run: npm run typecheck

      # Test before deploying. This step was missing entirely: the portal's suite
      # ran on developer machines and nowhere else, so a regression in the guided
      # launch defaults (TTL present, spot: false) would deploy to spore.host
      # unnoticed (spore-host#506). It now also pins the /app placeholder
      # (scripts/app-placeholder.test.mjs).
      - name: Test portal
        working-directory: web
        run: npm test

      # Emits web/dist: marketing pages, the app/ placeholder and
      # css/assets/cloudformation, copied verbatim (scripts/copy-static.mjs).
      # Build-time flags come from the committed web/.env.production.
      - name: Build site
        working-directory: web
        run: npm run build

      # spore.host/app must be the placeholder (spore-host#645): the built page
      # carries its marker and loads no script, no old portal bundle
      # (assets/app-*.js) is in the build to be uploaded, and nothing from the
      # rebuilt portal (web/portal/, #683) is either.
      - name: Assert /app is the placeholder and no portal bundle ships
        run: |
          set -euo pipefail
          page=web/dist/app/index.html
          grep -qF '<meta name="spore-host-page" content="app-placeholder">' "$page" \
            || { echo "::error::$page is not the /app placeholder (marker missing)." >&2; exit 1; }
          if grep -qi '<script' "$page"; then
            echo "::error::$page loads a script; the placeholder must not." >&2
            exit 1
          fi
          bundles="$(find web/dist/assets -name 'app-*.js' -print)"
          if [ -n "$bundles" ]; then
            echo "::error::old portal bundle(s) in the build: $bundles" >&2
            exit 1
          fi
          # The rebuilt portal (web/portal/, #683) is not published until slice 1
          # (#684) passes its gates. It builds into web/.portal-build/, never dist/;
          # its pages carry content="portal…" markers, so any that leak are found.
          leaked="$(grep -rlF 'name="spore-host-page" content="portal' web/dist || true)"
          if [ -n "$leaked" ] || [ -e web/dist/portal ]; then
            echo "::error::the rebuilt portal is in the build and would be deployed: ${leaked:-web/dist/portal}" >&2
            exit 1
          fi
          echo "✅ /app is the placeholder; no old or rebuilt portal in dist/"

      # The animated hero degrades silently: if the .riv or the vendored Rive
      # runtime is missing from dist/, the homepage still renders (it just falls
      # back to the static mark forever), so nothing else would catch it.
      - name: Assert the animated hero's assets are published
        run: |
          set -euo pipefail
          for f in \
            web/dist/assets/brand/spore-orb.riv \
            web/dist/assets/vendor/rive/rive.js \
            web/dist/assets/vendor/rive/rive.wasm
          do
            test -s "$f" || { echo "::error::$f missing from the build — the hero orb would silently fall back to the static mark." >&2; exit 1; }
          done
          echo "✅ hero orb scene + vendored Rive runtime present"

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

  # Holds id-token, and runs only the AWS CLI and this repo's own prune
  # script: no npm install, no package code. The trust's sub is unchanged
  # (repo:spore-host/spore-host:ref:refs/heads/main for a push to main; no
  # environment), so GitHubActionsDocsDeployRole still accepts it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # For scripts/prune_site_bucket.py. No dependencies are installed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: web/dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::966362334030:role/GitHubActionsDocsDeployRole
          aws-region: us-east-1

      # Two-pass sync so caching matches asset lifetime, and so returning visitors
      # never see a stale homepage. Hashed/static assets (css/js/assets) get a long
      # cache; HTML gets a short, must-revalidate cache. --delete only on the HTML
      # pass prunes removed pages. Source is web/dist (the build output) — see the
      # header: syncing raw web/ would ship the source app/index.html and break the
      # portal. dist/ contains only publishable artifacts, so no deploy.sh/README
      # excludes are needed.
      - name: Deploy to S3
        run: |
          set -euo pipefail
          # Pass 1: assets — a one-day cache. EXCLUDE css/ here: css/style.css is a hand-copied
          # static file with a STABLE name, so a 24h cache means a CSS change is
          # invisible to returning visitors for up to a day even after a CloudFront
          # invalidation (the edge is fresh, the browser isn't) — which is exactly how
          # a CSS update once paired new HTML with stale CSS and blew up the hero logo.
          aws s3 sync web/dist/ s3://spore-host-website/ \
            --cache-control "public, max-age=86400" \
            --exclude "*.html" \
            --exclude "css/*" \
            --exclude ".DS_Store"
          # Pass 1b: CSS — short cache + must-revalidate (like HTML), because the
          # filename is unhashed. A CSS change now shows up within ~1 min instead of
          # being stuck behind a browser's 24h cache.
          aws s3 sync web/dist/ s3://spore-host-website/ \
            --cache-control "public, max-age=60, must-revalidate" \
            --exclude "*" \
            --include "css/*"
          # Pass 2: HTML — short cache, always revalidate; --delete prunes here.
          aws s3 sync web/dist/ s3://spore-host-website/ \
            --delete \
            --cache-control "public, max-age=60, must-revalidate" \
            --exclude "*" \
            --include "*.html"

      # Passes 1 and 1b never delete, so every non-HTML file an old build
      # uploaded stayed published: old portal bundles (assets/app-*.js,
      # app/assets/), the legacy dashboard's js/ (#705). Delete what is under
      # the prefixes this build owns outright and is not in this build. Only
      # those four prefixes are touched; anything at the root or under
      # cloudformation/ is left alone. Runs after the upload, so nothing the
      # new HTML references can be removed. It refuses, deleting nothing, if
      # the build lacks a page it must have or if more than 500 objects would
      # go. Every key deleted is in the job summary.
      - name: Prune stale objects under the managed prefixes
        id: prune
        run: |
          python3 -I scripts/prune_site_bucket.py \
            --bucket spore-host-website --dist web/dist \
            --expected-owner 966362334030 \
            --prefix assets/ --prefix css/ --prefix app/ --prefix js/ \
            --require index.html --require app/index.html --require css/style.css \
            --require assets/brand/spore-host-og.png \
            --max-delete 500

      # Runs even if the prune refused or failed: the upload above succeeded, so
      # visitors must still get it. The job stays red for the prune.
      - name: Invalidate CloudFront
        if: success() || steps.prune.outcome == 'failure'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EY67INS5HDFLU \
            --paths "/*"

      # Post-deploy smoke: prove the LIVE site serves this build. Asserts a few
      # canonical strings that should always be present on the current homepage.
      # NOTE: fetch into a variable then match with a here-string — never PIPE into
      # `grep -q` under `set -o pipefail` (grep -q closes the pipe → the writer gets
      # a broken-pipe error → pipefail fails the whole pipeline despite a match).
      - name: Verify live site
        if: success() || steps.prune.outcome == 'failure'
        run: |
          set -euo pipefail
          BASE="https://spore.host"
          # Fetch the root normally — the CloudFront `/*` invalidation above already
          # guarantees freshness, so DON'T force a cache-buster / no-cache header:
          # that makes the S3 static-website origin revalidate and it can 404
          # momentarily mid-invalidation (a transient false negative, not a bad
          # deploy). A plain GET of "/" reliably serves the just-synced index.html.
          # Match with a here-string (never pipe into `grep -q` under pipefail).
          check() {  # $1=path  $2=needle
            local body
            body="$(curl -fsS "$BASE/$1")" || return 1
            grep -qF "$2" <<<"$body"
          }
          # /app/ must serve the placeholder (spore-host#645): its marker present
          # and no reference to the old portal bundle. The status code alone
          # would also pass for the old portal, so match the body.
          portal_ok() {
            local body
            body="$(curl -fsS "$BASE/app/")" || return 1
            grep -qF '<meta name="spore-host-page" content="app-placeholder">' <<<"$body" \
              && ! grep -qE 'assets/app-[^"]*\.js' <<<"$body"
          }
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if check "/" "Five tools" && portal_ok; then
              ok=1
              echo "✅ Live spore.host serves the current homepage + the /app placeholder."
              break
            fi
            echo "Attempt $attempt: live site not current yet (invalidation may still be propagating) — waiting…"
            sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            # WARN, don't fail. The deploy (s3 sync + CloudFront invalidation) is the
            # authoritative step and already succeeded above. This S3 static-website
            # origin intermittently 404s on a cold cache-miss right after an
            # invalidation, then serves 200 once the edge re-caches — a known
            # CloudFront+S3-website quirk, not a deploy defect. Failing the job here
            # would be a false negative (the same false-negative trap the docs smoke
            # hit). Surface it loudly for a human to spot-check, but don't block.
            echo "::warning::Post-deploy check did not see the current homepage within the retry window. The sync + invalidation succeeded; this is usually a transient cold-cache 404 from the S3 website origin. Spot-check https://spore.host/ manually."
          fi
