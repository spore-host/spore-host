name: Deploy Site

# Deploys the marketing site AND the portal (spore.host + spore.host/app) on
# every push to main under web/**. Before this workflow the site had NO CI
# deploy — it shipped only via the manual web/deploy.sh, so homepage edits sat in
# main until someone ran the script by hand and the live site drifted from source
# (exactly the staleness external reviews kept hitting). This gives web/ the same
# continuous, verified deploy the docs already have.
#
# web/ is a Vite build: `npm run build` emits web/dist/ (marketing pages copied
# verbatim + the portal SPA with hashed assets). We MUST build and sync dist/,
# never the source tree: web/app/index.html references `./main.ts`, which only
# exists in source. Syncing raw web/ overwrites the built app/index.html with
# that source one and the live portal 404s on main.ts into an empty shell.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-site.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Typecheck before deploying. A type error here means the bundle is wrong;
      # better to fail than ship it. web-ci.yml now gates this pre-merge too, so
      # this is the second line of defence rather than the only one.
      - name: Typecheck portal
        working-directory: web
        run: npm run typecheck

      # Test before deploying. This step was missing entirely: the portal's suite
      # ran on developer machines and nowhere else, so a regression in the guided
      # launch defaults (TTL present, spot: false) would deploy to spore.host
      # unnoticed (spore-host#506).
      - name: Test portal
        working-directory: web
        run: npm test

      # Emits web/dist: hashed portal SPA under app/ + assets/, marketing pages
      # and css/assets/cloudformation copied verbatim (scripts/copy-static.mjs).
      # Build-time config comes from the committed web/.env.production (all public
      # identifiers — see the comments there).
      - name: Build site + portal
        working-directory: web
        run: npm run build

      # Guard the exact failure this workflow used to cause: the built portal HTML
      # must reference a hashed bundle, never the source ./main.ts entry.
      - name: Assert the portal build is not a source stub
        run: |
          set -euo pipefail
          if grep -qF 'main.ts' web/dist/app/index.html; then
            echo "::error::web/dist/app/index.html still references main.ts — the Vite build did not replace the entry." >&2
            exit 1
          fi
          grep -qE 'src="\.\./assets/app-[^"]+\.js"' web/dist/app/index.html
          echo "✅ portal HTML references a hashed bundle"

      # The animated hero degrades silently: if the .riv or the vendored Rive
      # runtime is missing from dist/, the homepage still renders (it just falls
      # back to the static mark forever), so nothing else would catch it.
      - name: Assert the animated hero's assets are published
        run: |
          set -euo pipefail
          for f in \
            web/dist/assets/brand/spore-orb.riv \
            web/dist/assets/vendor/rive/rive.js \
            web/dist/assets/vendor/rive/rive.wasm
          do
            test -s "$f" || { echo "::error::$f missing from the build — the hero orb would silently fall back to the static mark." >&2; exit 1; }
          done
          echo "✅ hero orb scene + vendored Rive runtime present"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::966362334030:role/GitHubActionsDocsDeployRole
          aws-region: us-east-1

      # Two-pass sync so caching matches asset lifetime, and so returning visitors
      # never see a stale homepage. Hashed/static assets (css/js/assets) get a long
      # cache; HTML gets a short, must-revalidate cache. --delete only on the HTML
      # pass prunes removed pages. Source is web/dist (the build output) — see the
      # header: syncing raw web/ would ship the source app/index.html and break the
      # portal. dist/ contains only publishable artifacts, so no deploy.sh/README
      # excludes are needed.
      - name: Deploy to S3
        run: |
          # Pass 1: long-lived, content-addressed assets — long cache. Vite emits
          # hashed filenames under assets/ (e.g. terminal-UsCfG-Qc.js), so those are
          # safe to cache for a day. EXCLUDE css/ here: css/style.css is a hand-copied
          # static file with a STABLE name, so a 24h cache means a CSS change is
          # invisible to returning visitors for up to a day even after a CloudFront
          # invalidation (the edge is fresh, the browser isn't) — which is exactly how
          # a CSS update once paired new HTML with stale CSS and blew up the hero logo.
          aws s3 sync web/dist/ s3://spore-host-website/ \
            --cache-control "public, max-age=86400" \
            --exclude "*.html" \
            --exclude "css/*" \
            --exclude ".DS_Store"
          # Pass 1b: CSS — short cache + must-revalidate (like HTML), because the
          # filename is unhashed. A CSS change now shows up within ~1 min instead of
          # being stuck behind a browser's 24h cache.
          aws s3 sync web/dist/ s3://spore-host-website/ \
            --cache-control "public, max-age=60, must-revalidate" \
            --exclude "*" \
            --include "css/*"
          # Pass 2: HTML — short cache, always revalidate; --delete prunes here.
          aws s3 sync web/dist/ s3://spore-host-website/ \
            --delete \
            --cache-control "public, max-age=60, must-revalidate" \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EY67INS5HDFLU \
            --paths "/*"

      # Post-deploy smoke: prove the LIVE site serves this build. Asserts a few
      # canonical strings that should always be present on the current homepage.
      # NOTE: fetch into a variable then match with a here-string — never PIPE into
      # `grep -q` under `set -o pipefail` (grep -q closes the pipe → the writer gets
      # a broken-pipe error → pipefail fails the whole pipeline despite a match).
      - name: Verify live site
        run: |
          set -euo pipefail
          BASE="https://spore.host"
          # Fetch the root normally — the CloudFront `/*` invalidation above already
          # guarantees freshness, so DON'T force a cache-buster / no-cache header:
          # that makes the S3 static-website origin revalidate and it can 404
          # momentarily mid-invalidation (a transient false negative, not a bad
          # deploy). A plain GET of "/" reliably serves the just-synced index.html.
          # Match with a here-string (never pipe into `grep -q` under pipefail).
          check() {  # $1=path  $2=needle
            local body
            body="$(curl -fsS "$BASE/$1")" || return 1
            grep -qF "$2" <<<"$body"
          }
          # The portal's entry must reference a hashed bundle live, not main.ts —
          # a source stub returns 200 for /app/ but renders an empty shell, so
          # checking the status code alone would miss it.
          portal_ok() {
            local body
            body="$(curl -fsS "$BASE/app/")" || return 1
            grep -qE 'src="\.\./assets/app-[^"]+\.js"' <<<"$body"
          }
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if check "/" "Six tools" && portal_ok; then
              ok=1
              echo "✅ Live spore.host serves the current homepage + portal bundle."
              break
            fi
            echo "Attempt $attempt: live site not current yet (invalidation may still be propagating) — waiting…"
            sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            # WARN, don't fail. The deploy (s3 sync + CloudFront invalidation) is the
            # authoritative step and already succeeded above. This S3 static-website
            # origin intermittently 404s on a cold cache-miss right after an
            # invalidation, then serves 200 once the edge re-caches — a known
            # CloudFront+S3-website quirk, not a deploy defect. Failing the job here
            # would be a false negative (the same false-negative trap the docs smoke
            # hit). Surface it loudly for a human to spot-check, but don't block.
            echo "::warning::Post-deploy check did not see the current homepage within the retry window. The sync + invalidation succeeded; this is usually a transient cold-cache 404 from the S3 website origin. Spot-check https://spore.host/ manually."
          fi
