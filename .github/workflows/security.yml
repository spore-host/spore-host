name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday 8am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'

      - name: Install govulncheck
        # Pinned, matching spawn/truffle/the plugins: govulncheck v1.4.0 panics
        # ("ForEachElement called on type containing *types.TypeParam") analyzing
        # generics, so @latest crashes the scan (exit 1, not a vulnerability
        # finding). v1.3.0 is the last release that handles generic code. Bump
        # once the upstream regression is fixed.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Scan all Go modules
        run: |
          # Per-module scan: every nested go.mod (spore-bot, rest-api, …), not
          # just rest-api as before.
          set -e
          fail=0
          for mod in $(find . -name go.mod -not -path '*/vendor/*' | sort); do
            dir=$(dirname "$mod")
            echo "::group::govulncheck $dir"
            ( cd "$dir" && go mod tidy && govulncheck ./... ) || fail=1
            echo "::endgroup::"
          done
          exit $fail

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # gitleaks BINARY (MIT, free for orgs); the action wrapper needs a paid
      # org license. Allowlist in .gitleaks.toml covers doc examples + fixtures.
      #
      # Verified before it runs (#707), as spawn does (spawn#885). This binary
      # decides whether a merge carries a secret, and it ran as `curl | tar`
      # with nothing checked, so a replaced release asset would have run
      # unnoticed. The hash is pinned HERE rather than read from the release's
      # checksums.txt, because a file fetched alongside the download can be
      # replaced alongside it. Cross-checked against the published
      # gitleaks_8.21.2_checksums.txt and the downloaded asset when pinned.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.21.2
          SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          T="gitleaks_${VER}_linux_x64.tar.gz"
          curl -sSLf -o "$RUNNER_TEMP/$T" "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/$T"
          echo "$SHA256  $RUNNER_TEMP/$T" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$T" -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks detect
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy filesystem scan (vulns + secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    # Pinned by digest (#707): the untagged image ran whatever `latest` was
    # that day, inside the job that gates merges. This is the multi-arch index
    # for semgrep 1.185.0, read from registry-1.docker.io when pinned. Dependabot
    # does not update a workflow's container image, so bump it by hand. The
    # rules (--config=auto) are fetched at run time either way, so a stale
    # engine misses no new rule.
    container:
      image: semgrep/semgrep@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d # 1.185.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Semgrep scan
        run: semgrep scan --config=auto --error .
